<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Graph grid subtle texture -->
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.2" />
    </pattern>
    <!-- 45-degree diagonal splits -->
    <clipPath id="split-top-left">
      <polygon points="-20,-20 120,-20 -20,120" />
    </clipPath>
    <clipPath id="split-bottom-right">
      <polygon points="120,-20 120,120 -20,120" />
    </clipPath>
    <!-- Gradient ring -->
    <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005CE6" />
      <stop offset="100%" stop-color="#0096D6" />
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="50" cy="50" r="47" fill="#F0FAFF" stroke="url(#ring-gradient)" stroke-width="3.5" />
  <circle cx="50" cy="50" r="45" fill="url(#grid)" />

  <!-- The Rounded Plus Mark -->
  <!-- Top-left half: Cobalt Royal Blue (#005CE6) -->
  <g clip-path="url(#split-top-left)">
    <rect x="41" y="22" width="18" height="56" rx="9" fill="#005CE6" />
    <rect x="22" y="41" width="56" height="18" rx="9" fill="#005CE6" />
  </g>

  <!-- Bottom-right half: Deep Navy (#0F172A) -->
  <g clip-path="url(#split-bottom-right)">
    <rect x="41" y="22" width="18" height="56" rx="9" fill="#0F172A" />
    <rect x="22" y="41" width="56" height="18" rx="9" fill="#0F172A" />
  </g>

  <!-- Center highlight pin -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" fill-opacity="0.75" />
</svg>
